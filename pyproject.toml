[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-distributed-phase3"
version = "0.1.0"
description = "AllReduce and manual synchronous data parallel training exercises with PyTorch"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "torch",
]

[dependency-groups]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
