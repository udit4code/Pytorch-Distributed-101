[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-distributed-phase0"
version = "0.1.0"
description = "First-principles exercises for CPU distributed training with PyTorch"
requires-python = ">=3.11"
dependencies = ["torch"]

[dependency-groups]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
