<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img" aria-labelledby="title desc">
  <title id="title">Direct fan-out versus tree broadcast on four local ranks</title>
  <desc id="desc">Median milliseconds over seven trials for payloads from 1 to 64 MiB. Tree broadcast is faster at 1, 2, 8, and 16 MiB, while direct fan-out is faster at 4, 32, and 64 MiB. Whiskers show minimum and maximum observations.</desc>
  <style>
    :root { color-scheme: light dark; }
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #24292f; }
    .muted { fill: #57606a; }
    .frame, .grid, .tick { stroke: #8c959f; fill: none; }
    .grid { opacity: 0.28; }
    .manual { stroke: #0969da; fill: #0969da; }
    .tree { stroke: #cf4a00; fill: #cf4a00; }
    .series { stroke-width: 2.5; fill: none; }
    .whisker { stroke-width: 1.5; opacity: 0.7; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .muted { fill: #8c959f; }
      .frame, .grid, .tick { stroke: #6e7681; }
      .manual { stroke: #58a6ff; fill: #58a6ff; }
      .tree { stroke: #ffa657; fill: #ffa657; }
    }
  </style>

  <text x="410" y="26" text-anchor="middle" font-size="18" font-weight="600">Broadcast latency by payload size</text>
  <text x="410" y="47" text-anchor="middle" font-size="12" class="muted">4 local Gloo ranks · median of 7 trials · whiskers show min–max</text>

  <rect x="80" y="60" width="660" height="340" class="frame"/>
  <g font-size="11" class="muted">
    <line x1="80" y1="400" x2="740" y2="400" class="grid"/><text x="69" y="404" text-anchor="end">0</text>
    <line x1="80" y1="340" x2="740" y2="340" class="grid"/><text x="69" y="344" text-anchor="end">5</text>
    <line x1="80" y1="280" x2="740" y2="280" class="grid"/><text x="69" y="284" text-anchor="end">10</text>
    <line x1="80" y1="220" x2="740" y2="220" class="grid"/><text x="69" y="224" text-anchor="end">15</text>
    <line x1="80" y1="160" x2="740" y2="160" class="grid"/><text x="69" y="164" text-anchor="end">20</text>
    <line x1="80" y1="100" x2="740" y2="100" class="grid"/><text x="69" y="104" text-anchor="end">25</text>
  </g>

  <text x="20" y="230" transform="rotate(-90 20 230)" text-anchor="middle" font-size="12">Slowest-rank time (ms)</text>
  <text x="410" y="452" text-anchor="middle" font-size="12">Payload size (MiB, log₂ spacing)</text>

  <g font-size="11" class="muted" text-anchor="middle">
    <text x="100" y="420">1</text><text x="200" y="420">2</text>
    <text x="300" y="420">4</text><text x="400" y="420">8</text>
    <text x="500" y="420">16</text><text x="600" y="420">32</text>
    <text x="700" y="420">64</text>
  </g>

  <!-- Direct fan-out min-max whiskers. -->
  <g class="manual whisker">
    <path d="M94 393.2V389.8 M90 393.2H98 M90 389.8H98"/>
    <path d="M194 388.0V384.3 M190 388.0H198 M190 384.3H198"/>
    <path d="M294 379.0V372.3 M290 379.0H298 M290 372.3H298"/>
    <path d="M394 356.3V351.6 M390 356.3H398 M390 351.6H398"/>
    <path d="M494 354.9V292.0 M490 354.9H498 M490 292.0H498"/>
    <path d="M594 307.8V72.8 M590 307.8H598 M590 72.8H598"/>
    <path d="M694 213.4V175.0 M690 213.4H698 M690 175.0H698"/>
  </g>

  <!-- Tree min-max whiskers. -->
  <g class="tree whisker">
    <path d="M106 394.1V392.2 M102 394.1H110 M102 392.2H110"/>
    <path d="M206 388.6V387.1 M202 388.6H210 M202 387.1H210"/>
    <path d="M306 377.8V375.7 M302 377.8H310 M302 375.7H310"/>
    <path d="M406 375.2V348.3 M402 375.2H410 M402 348.3H410"/>
    <path d="M506 354.6V344.4 M502 354.6H510 M502 344.4H510"/>
    <path d="M606 298.6V284.4 M602 298.6H610 M602 284.4H610"/>
    <path d="M706 202.6V142.5 M702 202.6H710 M702 142.5H710"/>
  </g>

  <path d="M100 391.4 L200 387.5 L300 378.7 L400 352.9 L500 349.4 L600 297.0 L700 186.5" class="manual series"/>
  <path d="M100 392.4 L200 388.2 L300 376.9 L400 374.0 L500 350.9 L600 290.9 L700 182.7" class="tree series"/>

  <g class="manual">
    <circle cx="100" cy="391.4" r="4"/><circle cx="200" cy="387.5" r="4"/>
    <circle cx="300" cy="378.7" r="4"/><circle cx="400" cy="352.9" r="4"/>
    <circle cx="500" cy="349.4" r="4"/><circle cx="600" cy="297.0" r="4"/>
    <circle cx="700" cy="186.5" r="4"/>
  </g>
  <g class="tree">
    <rect x="102" y="388.4" width="8" height="8"/><rect x="202" y="384.2" width="8" height="8"/>
    <rect x="302" y="372.9" width="8" height="8"/><rect x="402" y="370.0" width="8" height="8"/>
    <rect x="502" y="346.9" width="8" height="8"/><rect x="602" y="286.9" width="8" height="8"/>
    <rect x="702" y="178.7" width="8" height="8"/>
  </g>

  <g font-size="12">
    <line x1="275" y1="475" x2="301" y2="475" class="manual series"/><circle cx="288" cy="475" r="4" class="manual"/>
    <text x="309" y="479">Direct fan-out</text>
    <line x1="430" y1="475" x2="456" y2="475" class="tree series"/><rect x="439" y="471" width="8" height="8" class="tree"/>
    <text x="464" y="479">Tree</text>
  </g>
</svg>
